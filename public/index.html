<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海龟汤</title>
<style>
:root{
  --broth-deep:#0B1312;
  --broth:#101A18;
  --broth-lift:#182523;
  --broth-edge:#243330;
  --porcelain:#E4E7E2;
  --sediment:#5C6B63;
  --sediment-dim:#3C4844;
  --clarify:#C9A227;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","STSong","Noto Serif CJK SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  --gutter:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--broth-deep);color:var(--porcelain);
  font-family:var(--sans);font-size:16px;line-height:1.5;overscroll-behavior:none}

.vessel{position:relative;max-width:520px;margin:0 auto;height:100dvh;
  display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% 0%,var(--broth-lift) 0%,var(--broth) 45%,var(--broth-deep) 100%);
  overflow:hidden}
.vessel::before{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,19,18,0) 0%,rgba(11,19,18,.55) 60%,rgba(11,19,18,.9) 100%);
  opacity:var(--murk,.85);transition:opacity 1.4s cubic-bezier(.22,.61,.36,1);
  pointer-events:none;z-index:0}
.vessel>*{position:relative;z-index:1}

.rim{display:flex;align-items:center;gap:9px;padding:calc(env(safe-area-inset-top) + 16px) var(--gutter) 12px}
.mark{font-family:var(--serif);font-size:19px;letter-spacing:.02em}
.rim .spacer{flex:1}
.tag{font-size:11px;color:var(--sediment);border:1px solid var(--broth-edge);
  padding:3px 8px;border-radius:999px}

.gauge{padding:0 var(--gutter) 14px;display:flex;align-items:center;gap:10px}
.gauge .track{flex:1;height:2px;background:var(--sediment-dim);position:relative}
.gauge .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--clarify);
  transition:width .7s cubic-bezier(.22,.61,.36,1)}
.gauge .read{font-size:11px;color:var(--sediment);font-variant-numeric:tabular-nums;white-space:nowrap}

.surface{margin:0 var(--gutter);border-top:1px solid var(--broth-edge);
  border-bottom:1px solid var(--broth-edge);padding:18px 0 16px}
.surface .body{font-family:var(--serif);font-size:18px;line-height:1.72;
  letter-spacing:.01em;margin:0;transition:max-height .45s ease,opacity .3s ease}
.surface.folded .body{max-height:1.72em;overflow:hidden;opacity:.55}
.fold{margin-top:12px;background:none;border:0;padding:0;color:var(--sediment);
  font-size:12px;cursor:pointer}
.fold:hover{color:var(--porcelain)}
.fold:focus-visible,.lang:focus-visible{outline:2px solid var(--clarify);outline-offset:3px}

.transcript{flex:1;overflow-y:auto;padding:4px var(--gutter) 12px;-webkit-overflow-scrolling:touch}
.empty{color:var(--sediment);font-size:14px;padding:28px 0;max-width:32ch}

.entry{display:flex;align-items:flex-start;gap:12px;padding:13px 0;
  border-bottom:1px solid rgba(36,51,48,.6);animation:settle .4s ease both}
@keyframes settle{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.entry .n{font-size:11px;color:var(--sediment-dim);font-variant-numeric:tabular-nums;
  padding-top:4px;min-width:1.6em}
.entry .q{flex:1;font-size:15px;line-height:1.5;word-break:break-word}
.entry.pending .q{opacity:.5}

.verdict{flex:none;font-size:12px;padding:3px 11px;border-radius:2px;white-space:nowrap;margin-top:2px}
.verdict.v是{background:var(--porcelain);color:var(--broth-deep);font-weight:600}
.verdict.v否{border:1px solid var(--sediment);color:var(--sediment);
  text-decoration:line-through;text-decoration-thickness:1px}
.verdict.v无关{border:1px dashed var(--sediment-dim);color:var(--sediment-dim);opacity:.75}
/* 换个问法：既不是命中也不是落空，不该读作失败 */
.verdict.v换个问法{border:1px solid var(--clarify);color:var(--clarify);opacity:.8}
.verdict.waiting{border:1px solid var(--sediment-dim);color:var(--sediment-dim);
  animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}

.aside{padding:10px 0 13px 34px;font-size:13px;color:var(--clarify);
  border-bottom:1px solid rgba(36,51,48,.6);animation:settle .4s ease both}
.aside.hintline{color:var(--sediment)}

.dock{padding:12px var(--gutter) calc(env(safe-area-inset-bottom) + 14px);
  border-top:1px solid var(--broth-edge);
  background:linear-gradient(180deg,rgba(16,26,24,.4),var(--broth-deep))}
.field{display:flex;gap:9px;align-items:flex-end}
.field textarea{flex:1;background:var(--broth-lift);border:1px solid var(--broth-edge);
  border-radius:10px;color:var(--porcelain);font-family:var(--sans);font-size:16px;
  line-height:1.45;padding:12px 14px;resize:none;min-height:48px;max-height:110px}
.field textarea::placeholder{color:var(--sediment-dim)}
.field textarea:focus{outline:none;border-color:var(--sediment)}
.ask{flex:none;min-width:60px;height:48px;border:0;border-radius:10px;
  background:var(--porcelain);color:var(--broth-deep);font-size:14px;font-weight:600;cursor:pointer}
.ask:disabled{background:var(--sediment-dim);color:var(--broth);cursor:default}
.ask:focus-visible{outline:2px solid var(--clarify);outline-offset:2px}

.minor{display:flex;gap:9px;margin-top:10px}
.minor button{flex:1;background:none;border:1px solid var(--broth-edge);border-radius:10px;
  color:var(--sediment);font-family:var(--sans);font-size:13px;padding:11px;cursor:pointer}
.minor button:hover:not(:disabled){color:var(--porcelain);border-color:var(--sediment)}
.minor button:disabled{opacity:.4;cursor:default}
.minor button:focus-visible{outline:2px solid var(--clarify);outline-offset:2px}

.bottom{position:absolute;inset:0;z-index:5;background:var(--broth-deep);
  display:flex;flex-direction:column;justify-content:center;padding:0 28px;
  transform:translateY(100%);transition:transform .95s cubic-bezier(.16,.84,.28,1)}
.bottom.up{transform:translateY(0)}
.bottom .label{font-size:11px;color:var(--clarify);margin-bottom:20px}
.bottom .answer{font-family:var(--serif);font-size:22px;line-height:1.68;margin:0 0 30px}
.bottom .stat{font-size:13px;color:var(--sediment);border-top:1px solid var(--broth-edge);padding-top:16px}
.bottom .again{margin-top:26px;align-self:flex-start;background:var(--porcelain);
  color:var(--broth-deep);border:0;border-radius:10px;padding:12px 22px;
  font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="vessel" id="vessel">
  <header class="rim">
    <span class="mark">海龟汤</span>
    <span class="tag" id="tagBroth">—</span>
    <span class="tag" id="tagGenre">—</span>
    <span class="spacer"></span>
  </header>

  <div class="gauge">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="read" id="read">0 问</span>
  </div>

  <section class="surface" id="surface">
    <p class="body" id="scene">正在盛汤…</p>
    <button class="fold" id="fold">收起题面</button>
  </section>

  <main class="transcript" id="transcript">
    <p class="empty" id="empty">提出一个只能用「是」「否」回答的问题。无关的线索会被标记出来。</p>
  </main>

  <footer class="dock">
    <div class="field">
      <textarea id="input" rows="1" placeholder="摆拖鞋的人住在这里吗？"></textarea>
      <button class="ask" id="ask">问</button>
    </div>
    <div class="minor">
      <button id="hint">提示 (0/0)</button>
      <button id="giveup">我放弃，见底</button>
    </div>
  </footer>

  <section class="bottom" id="bottom">
    <div class="label" id="bottomLabel">汤底</div>
    <p class="answer" id="answer"></p>
    <div class="stat" id="stat"></div>
    <button class="again" id="again">换一题</button>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const api = (path, body) => fetch(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body)
}).then(async r => {
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { data });
  return data;
});

let sid = null, puzzle = null, count = 0, busy = false, over = false;
let hintsUsed = 0, totalHints = 0;
let order = [];

async function boot() {
  const list = await fetch("/api/puzzles").then(r => r.json());
  order = list.map(p => p.id);
  await start(order[Math.floor(Math.random() * order.length)]);
}

async function start(puzzleId) {
  const res = await api("/api/start", { puzzleId });
  sid = res.sessionId;
  puzzle = res.puzzle;
  count = 0; over = false; hintsUsed = 0;
  totalHints = puzzle.totalHints;

  $("scene").textContent = puzzle.scene;
  $("tagBroth").textContent = puzzle.broth;
  $("tagGenre").textContent = puzzle.genre;
  $("transcript").innerHTML =
    `<p class="empty">提出一个只能用「是」「否」回答的问题。无关的线索会被标记出来。</p>`;
  $("surface").classList.remove("folded");
  $("fold").textContent = "收起题面";
  $("bottom").classList.remove("up");
  $("input").disabled = false;
  $("giveup").disabled = false;
  meter(0, puzzle.totalKeys);
  hintButton();
}

function meter(hitKeys, totalKeys) {
  const pct = totalKeys ? Math.round(hitKeys / totalKeys * 100) : 0;
  $("fill").style.width = pct + "%";
  $("vessel").style.setProperty("--murk", String(Math.max(0.12, 0.85 - pct / 135)));
  $("read").textContent = `${count} 问 · 见底 ${pct}%`;
}

function hintButton() {
  $("hint").textContent = `提示 (${hintsUsed}/${totalHints})`;
  $("hint").disabled = over || hintsUsed >= totalHints;
}

function aside(text, cls) {
  const el = document.createElement("div");
  el.className = "aside " + (cls || "");
  el.textContent = text;
  $("transcript").append(el);
  $("transcript").scrollTop = $("transcript").scrollHeight;
}

async function submit() {
  const text = $("input").value.trim();
  if (!text || busy || over) return;
  busy = true; $("ask").disabled = true;
  document.querySelector(".empty")?.remove();

  const row = document.createElement("div");
  row.className = "entry pending";
  row.innerHTML = `<span class="n"></span><span class="q"></span><span class="verdict waiting">···</span>`;
  row.querySelector(".n").textContent = String(count + 1).padStart(2, "0");
  row.querySelector(".q").textContent = text;
  $("transcript").append(row);
  $("transcript").scrollTop = $("transcript").scrollHeight;

  $("input").value = "";
  $("input").style.height = "auto";

  try {
    const r = await api("/api/ask", { sessionId: sid, question: text });
    const chip = row.querySelector(".verdict");
    chip.className = "verdict v" + r.verdict;
    chip.textContent = r.verdict;
    row.classList.remove("pending");

    if (r.degraded) {
      aside("裁判暂时联系不上，这一问没有被真正裁定。", "hintline");
    } else if (r.verdict === "换个问法") {
      // 不计入提问数，序号收回
      row.querySelector(".n").textContent = "";
      if (r.note) aside(r.note, "hintline");
    } else {
      count = r.asked;
      if (r.newKeys > 0) aside(`想到了一个关键点（${r.hitKeys}/${r.totalKeys}）`);
    }
    meter(r.hitKeys, r.totalKeys);

    if (r.solved) {
      over = true;
      $("bottomLabel").textContent = "见底了";
      finish(r.solution, `用了 ${count} 个问题`);
    }
  } catch (err) {
    row.remove();
    const msg = {
      session_expired: "这局已经过期了，请重开一题。",
      too_many_requests: "问得太快了，缓一下再问。"
    }[err.message] || "网络出了点问题，再问一次。";
    aside(msg, "hintline");
  } finally {
    busy = false; $("ask").disabled = false; hintButton();
    $("input").focus();
  }
}

function finish(solution, stat) {
  $("answer").textContent = solution;
  $("stat").textContent = stat;
  $("input").disabled = true;
  $("hint").disabled = true;
  $("giveup").disabled = true;
  $("bottom").classList.add("up");
}

$("ask").onclick = submit;
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
$("input").addEventListener("input", e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(110, e.target.scrollHeight) + "px";
});
$("fold").onclick = () => {
  const folded = $("surface").classList.toggle("folded");
  $("fold").textContent = folded ? "展开题面" : "收起题面";
};
$("hint").onclick = async () => {
  try {
    const r = await api("/api/hint", { sessionId: sid });
    hintsUsed = r.hintsUsed;
    aside("提示：" + r.hint, "hintline");
  } catch (_) {}
  hintButton();
};
$("giveup").onclick = async () => {
  if (over) return;
  const r = await api("/api/giveup", { sessionId: sid });
  over = true;
  $("bottomLabel").textContent = "汤底";
  finish(r.solution, `问了 ${r.asked} 个问题后放弃`);
};
$("again").onclick = () => {
  const next = order[(order.indexOf(puzzle.id) + 1) % order.length];
  start(next);
};

boot();
</script>
</body>
</html>
